# BookLore Docker Compose Example
# ================================
# The image can run without any volume mappings (for testing/demos).
# For production, mount volumes to persist data across container restarts.
#
# Quick start (no persistence):
#   docker run -p 6060:6060 booklore/booklore:latest
#
# Environment variables (customize paths):
#   DATA_DIR      Path to data directory (default: ./data)
#   BOOKS_DIR     Path to books directory (default: ./books)
#   BOOKDROP_DIR  Path to bookdrop directory (default: ./bookdrop)

services:
  booklore:
    # Official Docker Hub image:
    image: booklore/booklore:latest
    # Or the GHCR image:
    # image: ghcr.io/booklore-app/booklore:latest
    container_name: booklore
    environment:
      - USER_ID=0  # Modify this if the volume's ownership is not root
      - GROUP_ID=0 # Modify this if the volume's ownership is not root
      - TZ=Etc/UTC
      - BOOKLORE_PORT=6060                                  # Port BookLore listens on inside the container; must match container port below
      - SWAGGER_ENABLED=false                               # Enable or disable Swagger UI (API docs). Set to 'true' to allow access; 'false' to block access (recommended for production).
      - FORCE_DISABLE_OIDC=false                            # Set to 'true' to force-disable OIDC and allow internal login, regardless of UI config
    ports:
      - "6060:6060" # HostPort:ContainerPort → Keep both numbers the same, and also ensure the container port matches BOOKLORE_PORT, no exceptions. 
      # All three (host port, container port, BOOKLORE_PORT) must be identical for BookLore to function properly.
      # Example: To expose on host port 7070, set BOOKLORE_PORT=7070 and use "7070:7070".
    # Volumes are optional but recommended for data persistence
    volumes:
      - ${DATA_DIR:-./data}:/app/data       # (Recommended) SQLite database, settings, metadata, cache, Lucene indexes
      - ${BOOKS_DIR:-./books}:/books         # (Recommended) Primary book library folder
      - ${BOOKDROP_DIR:-./bookdrop}:/bookdrop   # (Optional) BookDrop auto-import folder
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    restart: unless-stopped
