# BookLore Development Docker Compose
# ====================================
# This runs BookLore in development mode with hot-reload for both backend and frontend.
#
# Usage:
#   docker compose -f dev.docker-compose.yml up
#
# Services:
#   - backend:  Spring Boot API (port 8080, debug port 5005)
#   - ui:       Angular dev server (port 4200)

services:
  backend:
    image: gradle:8-jdk21-alpine
    command: sh -c "cd /booklore-api && ./gradlew bootRun"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${REMOTE_DEBUG_PORT:-5005}:5005"
    environment:
      - REMOTE_DEBUG_ENABLED=true
      - SWAGGER_ENABLED=true
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - './booklore-api:/booklore-api'
      - ./shared/data:/app/data        # SQLite database stored here
      - ./shared/books:/books
      - ./shared/bookdrop:/bookdrop

  ui:
    image: node:22-alpine
    command: sh -c "cd /angular-app && npm install -g @angular/cli --force && npm install --force && ng serve --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - './booklore-ui:/angular-app'
      # Ignore package-lock to avoid cross-platform issues with optional dependencies
      - '/dev/null:/angular-app/package-lock.json'
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
