app:
  path-config: '/app/data'
  bookdrop-folder: '/bookdrop'
  version: 'development'
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
  remote-auth:
    enabled: ${REMOTE_AUTH_ENABLED:false}
    create-new-users: ${REMOTE_AUTH_CREATE_NEW_USERS:true}
    header-name: ${REMOTE_AUTH_HEADER_NAME:Remote-Name}
    header-user: ${REMOTE_AUTH_HEADER_USER:Remote-User}
    header-email: ${REMOTE_AUTH_HEADER_EMAIL:Remote-Email}
    header-groups: ${REMOTE_AUTH_HEADER_GROUPS:Remote-Groups}
    admin-group: ${REMOTE_AUTH_ADMIN_GROUP}
    groups-delimiter: ${REMOTE_AUTH_GROUPS_DELIMITER:\\s+}
  force-disable-oidc: ${FORCE_DISABLE_OIDC:false}
  telemetry:
    base-url: ${TELEMETRY_BASE_URL:https://telemetry.booklore.org}

server:
  forward-headers-strategy: native
  port: 8080
  tomcat:
    relaxed-query-chars: '[,],%,{,},|'

spring:
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: 600000
  application:
    name: booklore-api
  datasource:
    url: jdbc:sqlite:${app.path-config}/booklore.db?journal_mode=WAL&busy_timeout=60000&transaction_mode=IMMEDIATE
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10        # WAL mode allows concurrent readers
      minimum-idle: 2
      connection-timeout: 60000    # Wait up to 60s for connection
      leak-detection-threshold: 120000  # Detect connection leaks after 2 min
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update             # Creates/updates schema automatically
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true

springdoc:
  swagger-ui:
    path: /api/v1/swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /api/v1/api-docs

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.adityachandel.booklore: ${LOG_LEVEL:INFO}
    org.apache.fontbox: ERROR
    org.apache.pdfbox: ERROR
    org.quartz.core.QuartzScheduler: WARN
    org.quartz.simpl.SimpleThreadPool: WARN
    org.quartz.simpl.RAMJobStore: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR